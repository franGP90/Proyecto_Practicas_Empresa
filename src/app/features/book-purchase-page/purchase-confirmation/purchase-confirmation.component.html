<div class="w-screen min-h-screen overflow-x-hidden flex flex-col items-center justify-center bg-[url('/assets/backgroundImages/fondoBiblioteca.png')]">      <div class="bg-[#e1f4f7] p-8 rounded-md shadow-md max-w-lg w-full text-center">
        <h1 class="text-2xl font-bold mb-4">¡Compra realizada!</h1>
        <p class="text-gray-600 mb-6">Tu pedido ha sido procesado correctamente.</p>

        <h2 class="text-lg font-semibold mb-2">Historial de pedidos</h2>
        <div *ngFor="let order of orders$ | async" class="border-b pb-2 mb-2 text-left">
          <p class="text-sm text-gray-500">{{ order.date | date:'dd/MM/yyyy HH:mm' }}</p>
          <p *ngFor="let book of order.books">{{ book.title }} — {{ book.price }}€</p>
        </div>

        <a href="/home-page" class="mt-6 inline-block bg-cyan-500 text-white px-4 py-2 rounded-md">
          Volver al inicio
        </a>
      </div>
    </div>
