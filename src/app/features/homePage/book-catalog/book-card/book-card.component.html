<div class="m-2 p-3 w-60 h-90 bg-[#e1f4f7] rounded-md"  (mouseenter)="mouseEnterCard.set(true)" (mouseleave)="mouseEnterCard.set(false)">
    <div class="h-60">
        <img [src]="coverImageUrl" alt="Book Cover" class="p-1 w-full h-full object-cover mb-2 rounded-md"/>
    </div>
    <div #mainInfo> 
    <div class="text-lg font-semibold text-center">{{ title }}</div>
    <div class="text-md text-center text-gray-600">{{ author }}</div>
     <div *ngIf="mouseEnterCard()" class="flex justify-center">
        <button (click)=" openBookPurchasePageHandler()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded cursor-pointer">Details</button>
     </div>
    </div>
</div>
