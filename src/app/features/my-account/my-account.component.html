<div class="bg-[url('/assets/backgroundImages/fondoBiblioteca.png')] content-center min-h-screen max-w-screen overflow-x-hidden p-6">
 <div class="bg-cyan-50 overflow-hidden shadow-md shadow-amber-500 w-full h-137 border border-double border-cyan-300 rounded-md m-1"> 
    <h1 class="text-3xl font-bold m-1 text-amber-500">My Account</h1>
        <p class="m-1 text-amber-500">Bienvenido a tu cuenta, aquí puedes gestionar tu información personal, ver tu historial de pedidos y actualizar tus preferencias.</p>
        <div class="flex inline-flex  w-full">
            <div #manageOptions class="m-2 border border-cyan-300 rounded-md w-fit h-115">
                <ul class="hover:bg-cyan-100"><button class="Option-buttons" (click)="activeTab.set('settings')">Ajustes de cuenta</button></ul>
                <ul class="hover:bg-cyan-100"><button class="Option-buttons" (click)="activeTab.set('orders')">Historial de pedidos</button></ul>
                <ul class="hover:bg-cyan-100"><button class="Option-buttons" (click)="activeTab.set('preferences')">Preferencias</button></ul>
            </div>
            <div class="border border-cyan-300 rounded-md w-full m-2">
                @if(activeTab() === 'settings') {
                  <app-account-settings></app-account-settings>
                }
                @if(activeTab() === 'orders') {
                  <app-order-history></app-order-history>
                }
                @if(activeTab() === 'preferences') {
                  <app-preferences></app-preferences>
                }
            </div>
        </div>
    </div>
</div>
